# streamlit/environment.yml: warehouse runtime takes the Snowflake Anaconda channel only; pin with "="
name: sf_env
channels:
  - snowflake
dependencies:
  - streamlit=1.51.0          # needs 1.37 or later: st.navigation, st.fragment(run_every), dataframe row selection
  - snowflake-snowpark-python
  - pandas
  - altair
  - statsmodels               # Shift detail: ARIMA, SARIMA, Holt-Winters, STL, ADF (sr_ui/forecast.py)
  - pytorch                   # Shift detail: the TCN forecast (CPU); loaded only when TCN is selected
  - plotly                    # Insight Studio: interactive charts with selection and drawing tools
  - scikit-learn              # Insight Studio: gradient boosting, k-means, Isolation Forest
